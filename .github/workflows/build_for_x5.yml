name: Build For X5 & Upload AMR

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  DEVICE: x5
  CORE_ARCH: armv7
  COSMOS_ZIG_TARGET: arm-linux-gnueabihf
  COSMOS_ZIG_CPU: cortex_a7
  TARGET_ABI: armv7-glibc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''
      - name: Setup Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: false
      - name: Setup Zig 0.13
        shell: bash
        run: |
          version=0.13.0
          archive="$RUNNER_TEMP/zig-linux-x86_64-$version.tar.xz"
          curl -fsSL "https://ziglang.org/download/$version/zig-linux-x86_64-$version.tar.xz" -o "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-$version" >> "$GITHUB_PATH"
      - name: Install aiot-vue-cli and project dependencies
        shell: bash
        run: |
          npm install --global aiot-vue-cli@1.0.32
          aiot-cli --version
          npm install --no-audit --no-fund
      - name: Build ARMv7 core and JSAPI
        shell: bash
        run: pwsh -NoProfile -File ./build-core.ps1 -Architecture "$CORE_ARCH"
      - name: Build AMR package
        run: npm run build:prod
      - name: Upload AMR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-drive-x5-amr
          path: '*.amr'
          if-no-files-found: error
          retention-days: 30
